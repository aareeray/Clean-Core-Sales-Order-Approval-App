specVersion: "3.0"

metadata:
  name: com.company.salesorderapproval

type: application

framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: sap.fe.templates
    - name: sap.fe.core
    - name: themelib_sap_horizon

builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: fiori-app-sub-tasks
      afterTask: generateVersionInfo

server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - prefix: /sap
            url: "https://<your-btp-abap-host>"
            client: "100"
            # Uncomment and fill for BTP ABAP:
            # destination: "your-destination-name"
            # scp: true
            # pathPrefix: /sap
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
